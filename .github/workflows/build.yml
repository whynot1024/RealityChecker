name: Build RealityChecker

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 统一算版本号/commit/构建时间，供后面所有平台共用，保证注入的信息一致
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

  # Linux / Windows：单台 ubuntu 交叉编译
  build-cross:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p dist
          LDFLAGS="-s -w \
            -X RealityChecker/internal/version.Version=${{ needs.prepare.outputs.version }} \
            -X RealityChecker/internal/version.Commit=${{ needs.prepare.outputs.commit }} \
            -X RealityChecker/internal/version.BuildTime=${{ needs.prepare.outputs.build_time }}"
          go build -trimpath -tags netgo -installsuffix netgo \
            -ldflags "$LDFLAGS" \
            -o reality-checker${{ matrix.ext }} .
          zip -j dist/reality-checker-${{ matrix.goos }}-${{ matrix.goarch }}.zip reality-checker${{ matrix.ext }}
          sha256sum dist/*.zip > dist/reality-checker-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reality-checker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # macOS：真机 Apple Silicon (M芯片) 原生编译
  build-macos:
    needs: prepare
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify runner architecture
        run: uname -m

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: |
          set -e
          mkdir -p dist
          LDFLAGS="-s -w \
            -X RealityChecker/internal/version.Version=${{ needs.prepare.outputs.version }} \
            -X RealityChecker/internal/version.Commit=${{ needs.prepare.outputs.commit }} \
            -X RealityChecker/internal/version.BuildTime=${{ needs.prepare.outputs.build_time }}"
          go build -trimpath -ldflags "$LDFLAGS" -o reality-checker .
          chmod +x reality-checker
          zip -j dist/reality-checker-darwin-arm64.zip reality-checker
          shasum -a 256 dist/reality-checker-darwin-arm64.zip > dist/reality-checker-darwin-arm64.zip.sha256
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reality-checker-darwin-arm64
          path: dist/*

  # 汇总所有平台产物，统一发布 Release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build-cross, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: reality-checker-*
          merge-multiple: true

      - name: Show downloaded files
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Reality协议目标网站检测工具 ${{ needs.prepare.outputs.version }}

            **下载对照：**
            - `reality-checker-linux-amd64.zip` — Linux x86_64
            - `reality-checker-linux-arm64.zip` — Linux ARM64
            - `reality-checker-windows-amd64.zip` — Windows x86_64
            - `reality-checker-darwin-arm64.zip` — macOS Apple Silicon (M芯片)

            每个压缩包都附带同名 `.sha256` 校验文件。

            基本命令：
            `./reality-checker check example.com`
            `./reality-checker batch domain1 domain2 domain3`
            `./reality-checker csv domains.csv`

            **版本信息**
            - 版本：${{ needs.prepare.outputs.version }}
            - 提交：${{ needs.prepare.outputs.commit }}
            - 构建时间：${{ needs.prepare.outputs.build_time }}

            ---
            **注意**：本工具仅用于技术研究和学习目的，请遵守当地法律法规。
